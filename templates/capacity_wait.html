<!doctype html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ခေတ္တစောင့်ပေးပါ</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #090817; color: #f5f2ff; font-family: Inter, system-ui, sans-serif; }
    .card { width: min(100%, 470px); text-align: center; padding: 36px 26px; border: 1px solid rgba(194,93,255,.45); border-radius: 24px; background: linear-gradient(145deg, #17132f, #0d0b1c); box-shadow: 0 20px 70px rgba(139,44,255,.25); }
    .spinner { width: 62px; height: 62px; margin: 0 auto 22px; border: 5px solid rgba(255,255,255,.15); border-top-color: #d954ff; border-right-color: #6b8cff; border-radius: 50%; animation: spin 1s linear infinite; }
    h1 { margin: 0 0 14px; font-size: clamp(1.35rem, 5vw, 1.8rem); }
    p { margin: 10px 0; color: #b7afd8; line-height: 1.65; }
    .count { display: inline-block; margin-top: 14px; padding: 9px 15px; border-radius: 999px; color: #f5c8ff; background: rgba(217,84,255,.13); border: 1px solid rgba(217,84,255,.3); }
    .dots { letter-spacing: 4px; color: #d954ff; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .spinner, .dots { animation: none; } }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Web လူဝင်များနေပါသဖြင့်<br>ခေတ္တစောင့်ပေးပါ</h1>
    <p>လက်ရှိအသုံးပြုသူ {{ active }}/{{ limit }} ယောက်ရှိနေပါသည်။ လူတစ်ယောက်လျော့သွားတာနဲ့ အလိုအလျောက် ဝင်ခွင့်ပေးပါမယ်။</p>
    <span class="count">စောင့်နေပါသည် <span class="dots">•••</span></span>
  </main>
  <script>
    (() => {
      const check = async () => {
        try {
          const response = await fetch('{{ url_for("capacity_status") }}', { cache: 'no-store', credentials: 'same-origin' });
          const data = await response.json();
          if (data.admitted) window.location.reload();
          else document.querySelector('.count').innerHTML = `လက်ရှိ ${data.active}/${data.limit} ယောက် • စောင့်နေပါသည် <span class="dots">•••</span>`;
        } catch (_) {}
      };
      check();
      setInterval(check, 2500);
    })();
  </script>
</body>
</html>
